name: Deploy to N8N

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deployment to N8N
    runs-on: production
    timeout-minutes: 40
    steps:
      # Step 2: Set up SSH keys for deployment
      - name: Set up SSH (key + pinned host key)
        env:
          SSH_KEY: ${{ secrets.N8N_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.N8N_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          install -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
      # Step 3: Run deployment script via SSH
      - name: Deploy Application
        timeout-minutes: 30
        env:
          SSH_HOST: ${{ secrets.N8N_HOST_IP }}
          SSH_USER: ${{ secrets.N8N_SSH_USERNAME }}
          REMOTE_SCRIPT: |
            cd /workspace/n8n-reachinbox
            git pull origin main
            npm i 
            npm run build
            cd /root/n8n
            docker-compose restart 
        run: |
          set -euo pipefail
          printf '%s\n' "$REMOTE_SCRIPT" | ssh -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" 'bash -c "$(cat)"'

      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
      # Step 4: Slack Notification on Success
      - name: Notify Slack on Success
        if: success()
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          PROD_DEPLOY_ENV: ${{ secrets.prod_DEPLOY_ENV }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload=$(jq -n \
            --arg sha "$SHA" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg branch "$BRANCH" \
            --arg prod_deploy_env "$PROD_DEPLOY_ENV" \
            '{
              "text": "✅ *Deployment Successful*",
              "attachments": [
                {
                  "fallback": "Deployment successful for commit \($sha)",
                  "color": "good",
                  "title": "Deployment Successful",
                  "text": "*Repository*: \($repo)\n*Commit*: <https://github.com/\($repo)/commit/\($sha)|\($sha)>\n*Deployed by*: \($actor)",
                  "fields": [
                    {
                      "title": "Branch",
                      "value": "\($branch)",
                      "short": true
                    },
                    {
                      "title": "Environment",
                      "value": "\($prod_deploy_env)",
                      "short": true
                    }
                  ],
                  "footer": "GitHub Actions",
                  "footer_icon": "https://platform.slack-edge.com/img/default_application_icon.png"
                }
              ]
            }')
          curl -X POST -H 'Content-type: application/json' --data "$payload" \
          "$SLACK_WEBHOOK_URL"
      # Step 5: Slack Notification on Failure
      - name: Notify Slack on Failure
        if: failure()
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          PROD_DEPLOY_ENV: ${{ secrets.prod_DEPLOY_ENV }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload=$(jq -n \
            --arg sha "$SHA" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg branch "$BRANCH" \
            --arg prod_deploy_env "$PROD_DEPLOY_ENV" \
            '{
              "text": "❌ *Deployment Failed*",
              "attachments": [
                {
                  "fallback": "Deployment failed for commit \($sha)",
                  "color": "danger",
                  "title": "Deployment Failed",
                  "text": "*Repository*: \($repo)\n*Commit*: <https://github.com/\($repo)/commit/\($sha)|\($sha)>\n*Deployed by*: \($actor)",
                  "fields": [
                    {
                      "title": "Branch",
                      "value": "\($branch)",
                      "short": true
                    },
                    {
                      "title": "Environment",
                      "value": "\($prod_deploy_env)",
                      "short": true
                    }
                  ],
                  "footer": "GitHub Actions",
                  "footer_icon": "https://platform.slack-edge.com/img/default_application_icon.png"
                }
              ]
            }')
          curl -X POST -H 'Content-type: application/json' --data "$payload" \
          "$SLACK_WEBHOOK_URL"
